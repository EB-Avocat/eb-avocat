# Developer entrypoint (tox >= 4; `uv tool install tox --with tox-uv`).
#   tox -e dev              start the full stack (Postgres + Django + Next.js) in Docker
#   tox -e seed             create the dev admin and demo articles in the running stack
#   tox -e down             stop the stack
#   tox -e lint,type,test   backend checks (ruff, ty, pytest) — test needs `docker compose up -d db`
#   tox -e fmt              format + fix backend code
#   tox -e frontend         frontend lint, typecheck and tests (bun)
#
# Backend envs delegate to `uv run` inside backend/, so they use backend/uv.lock and
# the pinned Python from backend/.python-version (no separate tox-managed deps).
[tox]
requires = tox>=4.20
env_list = lint, type, test
skipsdist = true

[testenv]
skip_install = true
change_dir = {tox_root}/backend
allowlist_externals = uv
pass_env = HOME, PATH, DATABASE_URL, UV_*

[testenv:lint]
description = ruff lint, import sorting and format check
commands =
    uv run --frozen ruff check .
    uv run --frozen ruff format --check .

[testenv:fmt]
description = apply ruff fixes and formatting
commands =
    uv run --frozen ruff check --fix .
    uv run --frozen ruff format .

[testenv:type]
description = ty type check
commands = uv run --frozen ty check

[testenv:test]
description = pytest against Postgres (`docker compose up -d db`, or set DATABASE_URL)
set_env =
    DJANGO_DEBUG = 1
    DATABASE_URL = {env:DATABASE_URL:postgres://postgres:postgres@localhost:5433/eb_avocat}
commands = uv run --frozen pytest {posargs}

[testenv:dev]
description = run the full local stack (docker compose)
change_dir = {tox_root}
allowlist_externals = docker
pass_env = HOME, PATH, DOCKER_*
commands = docker compose up --build {posargs}

[testenv:down]
description = stop the local stack
change_dir = {tox_root}
allowlist_externals = docker
pass_env = HOME, PATH, DOCKER_*
commands = docker compose down {posargs}

[testenv:seed]
description = create the dev admin and demo content in the running stack
change_dir = {tox_root}
allowlist_externals = docker
pass_env = HOME, PATH, DOCKER_*
commands =
    docker compose exec backend python manage.py createadmin
    docker compose exec backend python manage.py seed_demo

[testenv:frontend]
description = frontend lint, typecheck and tests
change_dir = {tox_root}/frontend
allowlist_externals = bun
commands =
    bun install --frozen-lockfile
    bun run lint
    bun run typecheck
    bun run test
